[project]
name = "watchtower"
version = "0.1.0"
description = "Watchtower: AI agents that watch the web for you, India-first, with community watches."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "httpcore>=1.0.5",
    "selectolax>=0.3.21",
    "defusedxml>=0.7.1",
    "langgraph>=0.2.40",
    "langgraph-checkpoint-postgres>=2.0",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "jinja2>=3.1",
    "pywebpush>=2.0",
    "python-dateutil>=2.9",
    "idna>=3.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
render = ["playwright>=1.47"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.6",
    "locust>=2.31",
    "time-machine>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (Groq, Tavily, Brave). Opt-in with -m live",
    "slow: slower integration/load-style tests",
]
addopts = "-m 'not live' -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
omit = ["app/fetch/render.py"]
